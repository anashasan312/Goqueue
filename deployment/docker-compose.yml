# GoQueue local stack: the service, Redis, Prometheus and Grafana.
#
#   docker compose -f deployment/docker-compose.yml up --build
#
#   dashboard   http://localhost:9090/dashboard
#   api         http://localhost:8080/api/v1
#   prometheus  http://localhost:9091
#   grafana     http://localhost:3000   (admin / admin)

name: goqueue

services:
  redis:
    image: redis:7-alpine
    container_name: goqueue-redis
    # appendonly makes Redis durable across a restart. A task queue that loses
    # its pending set on a container bounce is not a queue, it is a cache.
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  goqueue:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    container_name: goqueue-app
    ports:
      - "8080:8080"
      - "9090:9090"
    environment:
      GOQUEUE_ENV: docker
      GOQUEUE_LOG_LEVEL: info
      GOQUEUE_REDIS_ADDRS: redis:6379
      GOQUEUE_WORKER_ENABLED: "true"
      GOQUEUE_SCHEDULER_ENABLED: "true"
    depends_on:
      redis:
        # Waiting for the healthcheck rather than just for the container means
        # the app does not fail its first connect and restart-loop on a cold
        # start.
        condition: service_healthy
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: goqueue-prometheus
    ports:
      - "9091:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    depends_on:
      - goqueue

  grafana:
    image: grafana/grafana:11.2.0
    container_name: goqueue-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      # The stack is a local demo; skipping the login page makes the dashboard
      # one click from `up`. Never do this in a deployed environment.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  redis-data:
  prometheus-data:
  grafana-data:
